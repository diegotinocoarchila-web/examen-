<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
      
    <!--Seccion semantica con id matricula o contrato -->
    <section id="matricula" class="contenedor -principal">
        <form class="formulario-matricula">
        <h2>Solicitud de Matricula</h2>
        <p>Completa tus datos para matricularte en nuestro curso de conducción.</p>

    <!-- Campo: Nombre completo -->
    <div class="grupo-campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Diego Fernando"required>
    </div>

    <!-- Campo: Correo electrónico -->
    <div class="grupo-campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@coreo.com" required>
    </div>

    <!-- Campo: Número de teléfono -->
     <div class="grupo-campo">
        <label for="telefono"> Número de teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="3001234567" pattern="[0-9]{7,10}" required>
     </div>

    <!-- Campo:tipo de curso -->
    <div class="grupo-campo">
        <label for="curso">Tipo de curso</label>
        <select id="curso" name="curso" required>
            <option value=""disabled selected>selected> Seleccione un curso...</option>
            <option value="carro">Carro </option>
            <option value="moto">moto </option>
            <option value="mixto">mixto</option>
        </select>
    </div>

    <!-- Campo: comentario -->
    <div class="grupo-campo">
        <label for="comentario">Comentario</label>
        <textarea id="comentario" name="comentario" placeholder="Escribe tu comentario aquí..." required></textarea>
    </div>

    <!-- Botón envío -->
     <button type="submit" class="boton-enviar">Enviar la solicitud</button>
</form>
</section>

</body>
</html>
